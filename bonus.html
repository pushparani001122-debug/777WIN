<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777WIN - Platform Bonuses</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0f19; color: #f3f4f6; padding: 15px; padding-bottom: 70px; }
        .header { background: #161b22; padding: 15px; border-radius: 10px; border: 1px solid #30363d; margin-bottom: 20px; text-align: center; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .bonus-info h3 { font-size: 0.95rem; color: #38bdf8; margin-bottom: 4px; }
        .bonus-info p { font-size: 0.8rem; color: #9ca3af; }
        .btn { background: #16a34a; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #161b22; border-top: 1px solid #30363d; display: flex; justify-content: space-around; padding: 10px 0; }
        .nav-item { color: #9ca3af; text-decoration: none; font-size: 0.8rem; text-align: center; }
        .nav-item.active { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Available Bonuses</h1>
    </div>

    <div id="bonusListContainer"></div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <a href="index.html" class="nav-item">Home</a>
        <a href="spin.html" class="nav-item">Spin</a>
        <a href="coupon.html" class="nav-item">Coupon</a>
        <a href="bonus.html" class="nav-item active">Bonus</a>
        <a href="history.html" class="nav-item">History</a>
        <a href="account.html" class="nav-item">Account</a>
    </div>

    <script>
        window.onload = function() {
            loadUserBonuses();
        };

        function loadUserBonuses() {
            let bonuses = JSON.parse(localStorage.getItem('adminBonuses') || '[]');
            let html = '';
            bonuses.forEach((b, index) => {
                html += `<div class="card">
                    <div class="bonus-info">
                        <h3>${b.title} (₹${b.amount})</h3>
                        <p>Condition: ${b.condition}</p>
                    </div>
                    <button class="btn" onclick="claimBonus(${index})">Claim</button>
                </div>`;
            });
            document.getElementById('bonusListContainer').innerHTML = html || '<p style="text-align:center; color:#9ca3af; margin-top:30px;">No bonuses available right now.</p>';
        }

        function claimBonus(index) {
            let bonuses = JSON.parse(localStorage.getItem('adminBonuses') || '[]');
            let b = bonuses[index];
            
            // Basic condition verification check (mock logic: check if user balance >= 100 or always allow with popup check)
            let userBalance = parseFloat(localStorage.getItem('userBalance') || '0');
            
            // Let's implement condition validation pop-up behavior requested
            let confirmCheck = confirm(`Bonus Condition: ${b.condition}\nDo you meet this condition to claim ₹${b.amount}?`);
            
            if(confirmCheck) {
                userBalance += parseFloat(b.amount);
                localStorage.setItem('userBalance', userBalance);

                let history = JSON.parse(localStorage.getItem('userHistory') || '[]');
                history.unshift({title: 'Bonus Claimed', desc: `${b.title} (₹${b.amount})`, time: new Date().toLocaleString()});
                localStorage.setItem('userHistory', JSON.stringify(history));

                bonuses.splice(index, 1);
                localStorage.setItem('adminBonuses', JSON.stringify(bonuses));
                loadUserBonuses();
                alert(`Bonus of ₹${b.amount} claimed successfully!`);
            } else {
                alert('Condition not fulfilled or cancelled! Pop-up closed.');
            }
        }
    </script>
</body>
</html>
