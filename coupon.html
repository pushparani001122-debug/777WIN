<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777WIN - Coupons</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0f19; color: #f3f4f6; padding: 15px; padding-bottom: 70px; }
        .header { background: #161b22; padding: 15px; border-radius: 10px; border: 1px solid #30363d; margin-bottom: 20px; text-align: center; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .card h2 { font-size: 1rem; margin-bottom: 15px; color: #38bdf8; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #9ca3af; }
        input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; font-size: 0.9rem; }
        .btn { background: #2563eb; color: white; border: none; padding: 10px 15px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #161b22; border-top: 1px solid #30363d; display: flex; justify-content: space-around; padding: 10px 0; }
        .nav-item { color: #9ca3af; text-decoration: none; font-size: 0.8rem; text-align: center; }
        .nav-item.active { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Redeem Coupons</h1>
    </div>

    <div class="card">
        <h2>Enter Coupon Code</h2>
        <div class="form-group">
            <label>Coupon Code</label>
            <input type="text" id="userCouponCode" placeholder="Enter code here">
        </div>
        <button class="btn" onclick="claimCoupon()">Claim Coupon</button>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <a href="index.html" class="nav-item">Home</a>
        <a href="spin.html" class="nav-item">Spin</a>
        <a href="coupon.html" class="nav-item active">Coupon</a>
        <a href="bonus.html" class="nav-item">Bonus</a>
        <a href="history.html" class="nav-item">History</a>
        <a href="account.html" class="nav-item">Account</a>
    </div>

        <script>
        function claimCoupon() {
            let enteredCode = document.getElementById('userCouponCode').value.trim().toUpperCase();
            if(!enteredCode) return alert('Please enter a coupon code!');

            // Key ko 'adminCoupons' se badal kar 'active_coupons' kar diya hai
            let coupons = JSON.parse(localStorage.getItem('active_coupons') || '[]');
            let foundIndex = coupons.findIndex(c => c.code.toUpperCase() === enteredCode);

            if(foundIndex !== -1) {
                let couponAmount = parseFloat(coupons[foundIndex].amount);
                
                // Active user balance update in both localStorage and backupDb
                let activeUser = localStorage.getItem('active_user');
                let backupDb = JSON.parse(localStorage.getItem('user_backup_db')) || [];
                let userObj = backupDb.find(u => u.username === activeUser || u.phone === activeUser || u.email === activeUser);
                
                let currentBalance = parseFloat(localStorage.getItem('userBalance') || '0');
                let newBalance = currentBalance + couponAmount;
                
                localStorage.setItem('userBalance', newBalance.toFixed(2));
                
                if(userObj) {
                    userObj.balance = newBalance;
                    localStorage.setItem('user_backup_db', JSON.stringify(backupDb));
                }

                // Add to history
                let history = JSON.parse(localStorage.getItem('userHistory') || '[]');
                history.unshift({title: 'Coupon Claimed', desc: `Code: ${enteredCode} (₹${couponAmount})`, time: new Date().toLocaleString()});
                localStorage.setItem('userHistory', JSON.stringify(history));

                // Remove claimed coupon
                coupons.splice(foundIndex, 1);
                localStorage.setItem('active_coupons', JSON.stringify(coupons));

                document.getElementById('userCouponCode').value = '';
                alert(`Successfully claimed ₹${couponAmount}! Added to your wallet.`);
            } else {
                alert('Invalid or expired coupon code!');
            }
        }
    </script>

</body>
</html>
