 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777WIN - Account</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0f19; color: #f3f4f6; padding-bottom: 70px; }
        
        /* Top Profile Banner */
        .profile-banner {
            background: linear-gradient(135deg, #1f2937, #111827);
            padding: 20px 15px;
            position: relative;
            border-bottom: 1px solid #30363d;
        }
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar-box {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            overflow: hidden;
            border: 2px solid #f59e0b;
            background: #21262d;
            position: relative;
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .user-details h3 {
            font-size: 0.95rem;
            color: #ffffff;
            font-weight: 600;
        }
        .user-details p {
            font-size: 0.8rem;
            color: #9ca3af;
            margin-top: 2px;
        }
        /* Top-Right Logout Button */
        .logout-icon-btn {
            background: rgba(220, 38, 38, 0.15);
            border: 1px solid #dc2626;
            color: #ef4444;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }

        /* Wallet Section */
        .wallet-card {
            background: #161b22;
            margin: 15px;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .wallet-title {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 5px;
        }
        .wallet-balance {
            font-size: 1.8rem;
            font-weight: bold;
            color: #38bdf8;
        }

        /* Quick Action Buttons Grid */
        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 0 15px;
            margin-bottom: 20px;
        }
        .action-btn {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 15px 5px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .action-btn:active {
            background: #21262d;
        }
        .action-btn span {
            display: block;
            font-size: 0.75rem;
            color: #d1d5db;
            margin-top: 6px;
            font-weight: 500;
        }
        .action-icon {
            font-size: 1.4rem;
        }

        /* Modal Popup for Logout Confirmation */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #161b22;
            border: 1px solid #30363d;
            width: 85%;
            max-width: 320px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .modal-box h3 {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .modal-box p {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 20px;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
        }
        .modal-btn {
            flex: 1;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            font-size: 0.9rem;
        }
        .btn-no { background: #30363d; color: #ffffff; }
        .btn-yes { background: #dc2626; color: #ffffff; }
    </style>
</head>
<body>

    <!-- Profile Banner with Avatar, UID & Logout -->
    <div class="profile-banner">
        <div class="profile-header">
            <div class="user-info">
                <div class="avatar-box">
                    <img src="https://i.imgur.com/8Km9tLL.png" alt="Avatar" id="userAvatar">
                </div>
                <div class="user-details">
                    <h3 id="userName">MEMBER777</h3>
                    <p>UID: <span id="userUid">24601419</span></p>
                </div>
            </div>
            <button class="logout-icon-btn" onclick="openLogoutModal()">Logout</button>
        </div>
    </div>

    <!-- Wallet Balance Area with Unique Referral Code -->
    <div class="wallet-card">
        <div class="wallet-title">Total Balance</div>
        <div class="wallet-balance" id="accountBalance">₹0.00</div>
        
        <!-- Referral Code Section inside Wallet Card -->
        <div style="margin-top: 15px; border-top: 1px solid #30363d; padding-top: 12px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <div style="font-size: 0.75rem; color: #9ca3af;">My Referral Code</div>
                <div id="userReferralCode" style="font-size: 1rem; font-weight: bold; color: #f59e0b; letter-spacing: 1px;">LOADING...</div>
            </div>
            <button onclick="copyReferralCode()" style="background: #2563eb; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer;">Copy Code</button>
        </div>
    </div>

    <!-- 4 Direct Feature Buttons -->
    <div class="actions-grid">
        <div class="action-btn" onclick="openFeature('deposit')">
            <div class="action-icon">📥</div>
            <span>Deposit</span>
        </div>
        <div class="action-btn" onclick="openFeature('withdrawal')">
            <div class="action-icon">📤</div>
            <span>Withdraw</span>
        </div>
        <div class="action-btn" onclick="openFeature('bonus')">
            <div class="action-icon">🎁</div>
            <span>Bonus</span>
        </div>
        <div class="action-btn" onclick="openFeature('rules')">
            <div class="action-icon">📜</div>
            <span>Rules</span>
        </div>
    </div>

    <!-- Logout Warning Modal -->
    <div class="modal-overlay" id="logoutModal">
        <div class="modal-box">
            <h3>Confirm Logout</h3>
            <p>Do you want to logout?</p>
            <div class="modal-btns">
                <button class="modal-btn btn-no" onclick="closeLogoutModal()">No</button>
                <button class="modal-btn btn-yes" onclick="confirmLogout()">Yes</button>
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            // 1. Load Live Wallet Balance from localStorage
            let balance = parseFloat(localStorage.getItem('userBalance') || '0').toFixed(2);
            document.getElementById('accountBalance').innerText = `₹${balance}`;

            // 2. Set Unique UID if not already created
            let storedUid = localStorage.getItem('userUid');
            if(!storedUid) {
                storedUid = Math.floor(10000000 + Math.random() * 90000000);
                localStorage.setItem('userUid', storedUid);
            }
            document.getElementById('userUid').innerText = storedUid;

            // 3. Load or Generate Unique Referral Code for User
            let activeUser = localStorage.getItem('active_user') || storedUid;
            let refCodes = JSON.parse(localStorage.getItem('user_referral_codes') || '{}');
            
            let myRefCode = refCodes[activeUser];
            if(!myRefCode) {
                // Ensure unique referral code generation
                do {
                    myRefCode = 'WIN' + Math.floor(100000 + Math.random() * 900000);
                } while(Object.values(refCodes).includes(myRefCode));

                refCodes[activeUser] = myRefCode;
                localStorage.setItem('user_referral_codes', JSON.stringify(refCodes));
            }
            document.getElementById('userReferralCode').innerText = myRefCode;
        };

        // Copy Referral Code Function
        function copyReferralCode() {
            let code = document.getElementById('userReferralCode').innerText;
            navigator.clipboard.writeText(code).then(() => {
                alert('Referral code copied successfully!');
            }).catch(err => {
                alert('Failed to copy code.');
            });
        }

        // Logout Modal Functions
        function openLogoutModal() {
            document.getElementById('logoutModal').style.display = 'flex';
        }

        function closeLogoutModal() {
            document.getElementById('logoutModal').style.display = 'none';
        }

        function confirmLogout() {
            localStorage.removeItem('active_user');
            window.location.href = 'index.html';
        }

        // Direct Navigation for Buttons
        function openFeature(type) {
            if(type === 'deposit') {
                if(typeof openModal === 'function') {
                    openModal('deposit');
                } else {
                    window.location.href = 'index.html?open=deposit';
                }
            } else if(type === 'withdrawal') {
                if(typeof openModal === 'function') {
                    openModal('withdrawal');
                } else {
                    window.location.href = 'index.html?open=withdrawal';
                }
            } else if(type === 'bonus') {
                window.location.href = 'bonus.html';
            } else if(type === 'rules') {
                window.location.href = 'rules.html';
            }
        }
    </script>
</body>
</html>
