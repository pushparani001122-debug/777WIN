<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777WIN - Account & Wallet</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0f19; color: #f3f4f6; padding: 15px; padding-bottom: 70px; }
        .header { background: #161b22; padding: 15px; border-radius: 10px; border: 1px solid #30363d; margin-bottom: 20px; text-align: center; }
        .balance-card { background: linear-gradient(135deg, #2563eb, #1d4ed8); padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        .balance-card h3 { font-size: 0.9rem; color: #93c5fd; margin-bottom: 5px; }
        .balance-card h1 { font-size: 2rem; color: #ffffff; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 15px; margin-bottom: 20px; }
        .card h2 { font-size: 1rem; margin-bottom: 15px; color: #38bdf8; border-bottom: 1px solid #30363d; padding-bottom: 8px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; color: #9ca3af; }
        input { width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 6px; font-size: 0.9rem; }
        .btn { background: #16a34a; color: white; border: none; padding: 10px 15px; border-radius: 6px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .btn-red { background: #dc2626; }
        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #161b22; border-top: 1px solid #30363d; display: flex; justify-content: space-around; padding: 10px 0; }
        .nav-item { color: #9ca3af; text-decoration: none; font-size: 0.8rem; text-align: center; }
        .nav-item.active { color: #38bdf8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>My Account & Wallet</h1>
    </div>

    <div class="balance-card">
        <h3>Total Balance</h3>
        <h1 id="userWalletBalance">₹0.00</h1>
    </div>

    <!-- Deposit Section -->
    <div class="card">
        <h2>Deposit Funds</h2>
        <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" id="depAmount" placeholder="Enter amount">
        </div>
        <div class="form-group">
            <label>UTR / Transaction ID</label>
            <input type="text" id="depUtr" placeholder="Enter UTR number">
        </div>
        <button class="btn" onclick="submitDeposit()">Submit Deposit Request</button>
    </div>

    <!-- Withdrawal Section -->
    <div class="card">
        <h2>Withdrawal Funds</h2>
        <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" id="withAmount" placeholder="Enter amount">
        </div>
        <div class="form-group">
            <label>Bank / UPI Details</label>
            <input type="text" id="withDetails" placeholder="Enter UPI ID or Bank Details">
        </div>
        <button class="btn btn-red" onclick="submitWithdrawal()">Submit Withdrawal Request</button>
    </div>

    <!-- Navigation Bar -->
    <div class="nav-bar">
        <a href="index.html" class="nav-item">Home</a>
        <a href="spin.html" class="nav-item">Spin</a>
        <a href="coupon.html" class="nav-item">Coupon</a>
        <a href="bonus.html" class="nav-item">Bonus</a>
        <a href="history.html" class="nav-item">History</a>
        <a href="account.html" class="nav-item active">Account</a>
    </div>

    <script>
        window.onload = function() {
            updateBalanceDisplay();
        };

        function updateBalanceDisplay() {
            let balance = localStorage.getItem('userBalance') || '0.00';
            document.getElementById('userWalletBalance').innerText = `₹${parseFloat(balance).toFixed(2)}`;
        }

        function submitDeposit() {
            let amount = document.getElementById('depAmount').value;
            let utr = document.getElementById('depUtr').value;
            if(!amount || !utr) return alert('Please fill all deposit details');

            let requests = JSON.parse(localStorage.getItem('userRequests') || '[]');
            requests.push({
                user: 'user_' + Math.floor(Math.random()*1000),
                type: 'Deposit',
                amount: amount,
                details: `UTR: ${utr}`,
                status: 'Pending'
            });
            localStorage.setItem('userRequests', JSON.stringify(requests));

            document.getElementById('depAmount').value = '';
            document.getElementById('depUtr').value = '';
            alert('Deposit request submitted successfully! Waiting for admin approval.');
        }

        function submitWithdrawal() {
            let amount = document.getElementById('withAmount').value;
            let details = document.getElementById('withDetails').value;
            let balance = parseFloat(localStorage.getItem('userBalance') || '0');

            if(!amount || !details) return alert('Please fill all withdrawal details');
            if(parseFloat(amount) > balance) return alert('Insufficient balance!');

            // Deduct temporarily or on approval? Let's deduct on approval or keep pending request
            let requests = JSON.parse(localStorage.getItem('userRequests') || '[]');
            requests.push({
                user: 'user_' + Math.floor(Math.random()*1000),
                type: 'Withdrawal',
                amount: amount,
                details: `UPI: ${details}`,
                status: 'Pending'
            });
            localStorage.setItem('userRequests', JSON.stringify(requests));

            document.getElementById('withAmount').value = '';
            document.getElementById('withDetails').value = '';
            alert('Withdrawal request submitted successfully!');
        }
    </script>
</body>
</html>
