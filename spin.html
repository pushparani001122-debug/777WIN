 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin & Win - 777WIN</title>
    <style>
        :root {
            --bg-main: #070b19;
            --bg-card: #0f172a;
            --accent-gold: #d4af37;
            --text-white: #ffffff;
            --text-gray: #94a3b8;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 16px;
            text-align: center;
        }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 10px;
        }
        .back-btn {
            background: var(--bg-card);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
        }
        h1 {
            font-size: 26px;
            color: var(--accent-gold);
            margin: 10px 0 20px 0;
            letter-spacing: 2px;
        }
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 20px auto;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            border: 4px solid var(--accent-gold);
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-bottom: 24px solid var(--accent-gold);
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(212, 175, 55, 0.6));
        }
        .info-box {
            background-color: var(--bg-card);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 12px;
            max-width: 320px;
            margin: 0 auto 20px auto;
            font-size: 15px;
        }
        .info-box span {
            color: #22c55e;
            font-weight: bold;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 320px;
            margin: 0 auto;
        }
        .action-btn {
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #000;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .action-btn:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
        #message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" class="back-btn">← Back</a>
        <span style="font-weight: bold; color: var(--accent-gold);">777WIN</span>
        <div></div>
    </div>

    <h1>TRY YOUR LUCK 🎡</h1>

    <div class="info-box">
        Collected Balance: <span id="collected-coins">0</span> Coins<br>
        <small style="color: var(--text-gray);">Min. 500 coins required to cashout</small>
    </div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="400" height="400"></canvas>
    </div>

    <div class="btn-container">
        <button class="action-btn" id="spin-btn" onclick="startSpin()">SPIN NOW</button>
        <button class="action-btn" id="cashout-btn" onclick="cashoutCoins()" style="background: #22c55e; color: #fff;">CASHOUT TO WALLET</button>
    </div>

    <div id="message"></div>

    <script>
        const sectors = [
            { color: "#1e293b", text: "1 - 10" },
            { color: "#0f172a", text: "0" },
            { color: "#1e293b", text: "50-100" },
            { color: "#0f172a", text: "200" },
            { color: "#1e293b", text: "40" },
            { color: "#0f172a", text: "150" },
            { color: "#1e293b", text: "80" },
            { color: "#0f172a", text: "500" }
        ];

        const canvas = document.getElementById("wheel");
        const ctx = canvas.getContext("2d");
        const totalSectors = sectors.length;
        const arc = (2 * Math.PI) / totalSectors;
        let currentRotation = 0;
        let isSpinning = false;

        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let outsideRadius = 180;
            let insideRadius = 0;
            let textRadius = 120;

            for (let i = 0; i < totalSectors; i++) {
                let angleStart = i * arc - Math.PI / 2; // Offset to align sector 0 at top
                let angleEnd = (i + 1) * arc - Math.PI / 2;

                ctx.beginPath();
                ctx.arc(200, 200, outsideRadius, angleStart, angleEnd, false);
                ctx.arc(200, 200, insideRadius, angleEnd, angleStart, true);
                ctx.fillStyle = sectors[i].color;
                ctx.fill();
                ctx.strokeStyle = "#d4af37";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.fillStyle = "#d4af37";
                let textAngle = angleStart + arc / 2;
                ctx.translate(
                    200 + Math.cos(textAngle) * textRadius,
                    200 + Math.sin(textAngle) * textRadius
                );
                ctx.rotate(textAngle + Math.PI / 2);
                ctx.font = "bold 18px Segoe UI";
                ctx.fillText(sectors[i].text, -ctx.measureText(sectors[i].text).width / 2, 0);
                ctx.restore();
            }
        }

        function updateUI() {
            let activeUser = localStorage.getItem('active_user') || "testuser";
            let spinData = JSON.parse(localStorage.getItem(`spin_data_${activeUser}`)) || { balance: 0, lastSpin: 0 };
            
            document.getElementById('collected-coins').innerText = spinData.balance;

            let now = new Date().getTime();
            let oneWeek = 7 * 24 * 60 * 60 * 1000;
            if (spinData.lastSpin && (now - spinData.lastSpin < oneWeek)) {
                let spinBtn = document.getElementById('spin-btn');
                spinBtn.disabled = true;
                spinBtn.innerText = "ALREADY SPINNED (NEXT IN 1 WEEK)";
            }
        }

        function startSpin() {
            if (isSpinning) return;
            isSpinning = true;
            let spinBtn = document.getElementById('spin-btn');
            spinBtn.disabled = true;
            let msgBox = document.getElementById('message');
            msgBox.innerText = "";

            // Probability logic: Index 0 ("1-10") = 20%, Index 1 ("0") = 80%
            let rand = Math.random();
            let winningIndex = (rand < 0.80) ? 1 : 0; 

            // Exact angle mapping so winning index lands precisely under top pointer
            let degreesPerSector = 360 / totalSectors;
            let targetSectorAngle = winningIndex * degreesPerSector;
            
            let extraSpins = 360 * 5; // 5 full rotations
            let targetRotation = 360 - targetSectorAngle;
            
            // Calculate absolute rotation ensuring smooth forward spin
            let degreeDiff = (targetRotation - (currentRotation % 360) + 360) % 360;
            currentRotation += extraSpins + degreeDiff;

            canvas.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                isSpinning = false;
                processWin(winningIndex);
            }, 4000);
        }

        function processWin(winningIndex) {
            let wonAmount = 0;
            if (winningIndex === 0) {
                wonAmount = Math.floor(Math.random() * 10) + 1;
            } else {
                wonAmount = 0;
            }

            let activeUser = localStorage.getItem('active_user') || "testuser";
            let spinData = JSON.parse(localStorage.getItem(`spin_data_${activeUser}`)) || { balance: 0, lastSpin: 0 };

            spinData.balance += wonAmount;
            spinData.lastSpin = new Date().getTime();
            localStorage.setItem(`spin_data_${activeUser}`, JSON.stringify(spinData));

            updateUI();
            let msgBox = document.getElementById('message');
            msgBox.style.color = wonAmount > 0 ? "#22c55e" : "#ef4444";
            msgBox.innerText = `You won ${wonAmount} coins! (You can spin again after 1 week)`;
        }

        function cashoutCoins() {
            let activeUser = localStorage.getItem('active_user') || "testuser";
            let spinData = JSON.parse(localStorage.getItem(`spin_data_${activeUser}`)) || { balance: 0, lastSpin: 0 };
            let msgBox = document.getElementById('message');

            if (spinData.balance < 500) {
                msgBox.style.color = "#ef4444";
                msgBox.innerText = "Minimum 500 coins required to cashout!";
                return;
            }

            let userDb = JSON.parse(localStorage.getItem('user_backup_db')) || [];
            let userObj = userDb.find(u => u.username === activeUser || u.email === activeUser);

            if (!userObj) {
                userObj = { username: activeUser, balance: 0 };
                userDb.push(userObj);
            }

            userObj.balance = (parseFloat(userObj.balance) || 0) + spinData.balance;
            localStorage.setItem('user_backup_db', JSON.stringify(userDb));

            spinData.balance = 0;
            localStorage.setItem(`spin_data_${activeUser}`, JSON.stringify(spinData));

            updateUI();
            msgBox.style.color = "#22c55e";
            msgBox.innerText = "Successfully transferred spin coins to main wallet!";
        }

        window.onload = () => {
            drawWheel();
            updateUI();
        };
    </script>
</body>
</html>
