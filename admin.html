<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>777WIN // ADMIN CENTER</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0f19; color: #f3f4f6; padding: 15px; padding-bottom: 40px; }
        
        .admin-header { display: flex; justify-content: space-between; align-items: center; background: #161b22; padding: 12px 15px; border-radius: 8px; border: 1px solid #30363d; margin-bottom: 15px; }
        .admin-title-main { font-size: 1rem; font-weight: bold; color: #f3f4f6; letter-spacing: 0.5px; }
        .lock-terminal-btn { background: #dc2626; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }

        .section-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
        .section-title { font-size: 0.85rem; font-weight: bold; color: #9ca3af; margin-bottom: 10px; display: block; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .form-group { margin-bottom: 12px; }
        .form-label { display: block; font-size: 0.8rem; color: #d1d5db; margin-bottom: 5px; font-weight: 500; }
        .form-input { width: 100%; background: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: white; padding: 9px 12px; font-size: 0.85rem; outline: none; }
        
        .action-btn { width: 100%; background: #16a34a; color: white; border: none; border-radius: 6px; padding: 10px; font-size: 0.85rem; font-weight: bold; cursor: pointer; text-align: center; }
        .action-btn.red-theme { background: #e11d48; }

        .requests-table { width: 100%; border-collapse: collapse; font-size: 0.75rem; margin-top: 5px; }
        .requests-table th, .requests-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #30363d; }
        .requests-table th { color: #9ca3af; background: #0d1117; }
        .no-data { text-align: center; color: #6b7280; padding: 15px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <!-- Admin Header -->
    <div class="admin-header">
        <div class="admin-title-main">777WIN // ADMIN CENTER</div>
        <button class="lock-terminal-btn">Lock Terminal</button>
    </div>

    <!-- Deposit QR & UPI Controller -->
    <div class="section-card">
        <span class="section-title">Deposit QR & UPI Controller</span>
        <div class="form-group">
            <label class="form-label">Admin UPI ID</label>
            <input type="text" class="form-input" value="8437871238@fam">
        </div>
        <div class="form-group">
            <label class="form-label">Upload QR Code Image (Gallery)</label>
            <input type="file" class="form-input" style="padding: 6px;">
        </div>
        <button class="action-btn">Save Payment Gateway</button>
    </div>
  
  <!-- NEW: Aviator Game Result Controller -->
    <div class="section-card" style="border-color: #e11d48;">
        <span class="section-title" style="color: #e11d48;">Aviator Game Result Controller</span>
        <div class="form-group">
            <label class="form-label">Target Crash Multiplier (Leave blank for 1.00x crash)</label>
            <input type="number" id="adminMultiplierInput" class="form-input" placeholder="e.g. 2.50">
        </div>
        <button class="action-btn red-theme" onclick="saveAdminMultiplier()">Set Next Game Result</button>
        <div id="adminStatusMsg" style="font-size: 0.75rem; color: #22c55e; margin-top: 8px; text-align: center;"></div>
    </div>

    <!-- Generate Coupon Code -->
    <div class="section-card">
        <span class="section-title">Generate Coupon Code</span>
        <div class="form-group">
            <label class="form-label">Coupon Code</label>
            <input type="text" class="form-input" placeholder="e.g. WIN999">
        </div>
        <div class="form-group">
            <label class="form-label">Amount (₹)</label>
            <input type="number" class="form-input" placeholder="e.g. 100">
        </div>
        <button class="action-btn" style="background: #2563eb;">Create Coupon</button>
    </div>

    <!-- Pending Requests -->
    <div class="section-card">
        <span class="section-title">Pending Deposit / Withdrawal Requests</span>
        <table class="requests-table">
            <thead>
                <tr><th>User</th><th>Type</th><th>Details</th><th>Action</th></tr>
            </thead>
            <tbody>
                <tr><td colspan="4" class="no-data">No pending requests</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        window.onload = function() {
            let savedVal = localStorage.getItem('adminNextMultiplier');
            if(savedVal) {
                document.getElementById('adminMultiplierInput').value = savedVal;
            }
        };

        function saveAdminMultiplier() {
            let val = document.getElementById('adminMultiplierInput').value.trim();
            let msg = document.getElementById('adminStatusMsg');
            if(val === "" || isNaN(val) || parseFloat(val) <= 0) {
                localStorage.removeItem('adminNextMultiplier');
                msg.innerText = "Saved Successfully: Default Direct Crash at 1.00x";
            } else {
                localStorage.setItem('adminNextMultiplier', val);
                msg.innerText = `Saved Successfully: Game will crash at ${val}x`;
            }
            setTimeout(() => { msg.innerText = ""; }, 4000);
        }
    </script>
</body>
</html>
